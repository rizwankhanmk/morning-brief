<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{TITLE}}</title>
<style>
  /* Some clients drop this block entirely, so nothing below is relied on. */
  body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
  a { color: #0071E3; text-decoration: none; }
</style>
</head>
<body style="margin:0;padding:0;background:#F3F3F1;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#F3F3F1;">
  <tr>
    <td align="center" style="padding:20px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:600px;">
        <tr>
          <td style="background:#FFFFFF;padding:28px 6% 26px 6%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1D1D1F;">

            <!-- Weather -->
            <p style="margin:0 0 18px 0;line-height:1.2;">
{{WEATHER}}
            </p>
            <p style="margin:0 0 26px 0;font-size:16px;line-height:1.5;color:#6E6E73;">{{LEDE}}</p>

            <!-- Stocks -->
{{STOCKS}}

            <!-- Sections -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
{{SECTIONS}}
            </table>

            <!-- Footer -->
            <p style="margin:26px 0 0 0;padding-top:14px;border-top:1px solid #E5E5EA;font-size:12px;line-height:1.5;color:#8E8E93;">{{FOOTER}}</p>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
